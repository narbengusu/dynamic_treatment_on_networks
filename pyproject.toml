[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qising"
version = "0.1.0"
description = "Q-Ising: dynamic Ising model of network dynamics and offline conservative Q-learning for sequential treatment allocation on networks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["qising*"]
